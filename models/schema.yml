version: 2

models:

  - name: stg_orders

    columns:

      - name: order_id
        tests:
          - unique
          - not_null

      - name: customer_id
        tests:
          - not_null

      - name: order_date
        tests:
          - not_null

  - name: stg_sales

    columns:

      - name: order_id
        tests:
          - not_null

          - relationships:
              to: ref('stg_orders')
              field: order_id

      - name: product_id
        tests:
          - not_null

      - name: customer_id
        tests:
          - not_null